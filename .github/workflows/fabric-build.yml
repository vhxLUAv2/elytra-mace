name: Fabric Build

on:
  push:
    branches:
      - fabric-1.21.11
    paths:
      - 'fabric/elytra-mace/**'
      - '.github/workflows/fabric-build.yml'
  pull_request:
    paths:
      - 'fabric/elytra-mace/**'
      - '.github/workflows/fabric-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build mod
        run: gradle -p fabric/elytra-mace build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: elytra-mace-fabric-1.21.11
          path: |
            fabric/elytra-mace/build/libs/*.jar
            !fabric/elytra-mace/build/libs/*-sources.jar
          if-no-files-found: error